<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
        --color-clifford: #da373d;
      }
    </style>

</head>

<body>

    <div class=" bg-gray-300">



        <p>
        <div class="flex flex-col gap-3 p-4 max-w-md mx-auto">
            <label class="flex flex-col">
                <span class="text-sm font-medium">First name</span>
                <input id="firstName" type="text" placeholder="Enter first name" class="mt-1 p-2 border rounded" />
            </label>

            <label class="flex flex-col">
                <span class="text-sm font-medium">Last name</span>
                <input id="lastName" type="text" placeholder="Enter last name" class="mt-1 p-2 border rounded" />
            </label>

            <div class="flex items-center space-x-2">
                <button id="showName" class="px-4 py-2 bg-blue-600 text-white rounded"
                    onClick="showNames(firstName, lastName)">Show full name</button>
            </div>

            <p id="fullName" class="mt-2 text-lg font-semibold text-gray-800">

            </p>
        </div>
        </p>
    </div>


    <script src="conditions.js"></script>

</body>

</html>
