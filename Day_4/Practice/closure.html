<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    function updateCounter() {
        var counter = 1;
        counter = counter + 1;
        console.log(counter)

    }

    var updateCounter1 = (function () {
        var counter = 0;
        return function () {
            counter++;
            console.log(counter);
        }
    }());
</script>

<body>
    <h2>Closures</h2>
    <button onclick="updateCounter1()">Click here +</button>

</body>

</html>
